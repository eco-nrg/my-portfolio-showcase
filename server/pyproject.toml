[tool.poetry]
name = "eco-nrg-server"
description = "EcoNrg API server"
version = "0.1.0"
readme = "README.md"
authors = ["eco-nrg"]
classifiers = ["Private :: Do not Upload"]

[tool.poetry.dependencies]
python = "3.9.15"

django = { version = "^4.2" }
django-ninja = "^0.22.2"

channels = { version = "^4.0.0", extras = ["daphne"] }
channels-redis = "^4.1.0"

pyOpenSSL = "^23.2.0"
six = "^1.16"
sqlparse = "^0.4"
tzdata = "^2023.3"
pytils = "^0.4"
requests = "^2.31"
simplejson = "^3.19"
Pillow = "^9.5"
schedule = "^1.2"
pytz = "^2023.3"
pydantic = "^1.10"
python-decouple = "^3.8"

influxdb-client = { version = "^1.36", extras = ["ciso"] }
psycopg2-binary = "^2.9"
# gunicorn = "^20.0"
daphne = "^4.0"

rich = "^13.4"
structlog = "^23.1"
sentry-sdk = { extras = ["django"], version = "^1.28.1" }
structlog-sentry = "^2.0.3"
django-jsoneditor = "^0.2.4"
redis = "^5.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-django = "^4.5"
pytest-asyncio = "^0.21.0"
pytest-mock = "^3.11.1"
responses = "^0.23.3"

jmespath = "^1.0.1"

pyright = "^1.1.327"
mypy = "^1.5"
types-simplejson = "^3.19.0.2"
django-stubs = "^4.2"

ruff = "^0.0.287"
black = "^23.9.1"

ipython = "^8.14"
ipdb = "^0.13.13"
types-requests = "^2.31.0.2"

[build-system]
requires = ["poetry-core>=1.6"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mywebsite.settings"

[tool.ruff]
# Same as Black.
line-length = 88

# https://beta.ruff.rs/docs/
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "C",   # flake8-comprehensions
  "C90", # mccabe
  "B",   # flake8-bugbear
  "Q",   # flake8-quotes
  "N",   # pep8-naming
  "S",   # flake8-bandit (security)
  "A",   # flake8-builtins
  "UP",  # pyupgrade
  "PIE", # flake8-pie
  "T20", # flake8-print
  "COM", # flake8-commas
  "DTZ", # flake8-datetimez
  "DJ",  # flake8-django
  "ISC", # flake8-implicit-str-concat
  "PT",  # flake8-pytest-style 
  "RET", # flake8-return
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "ERA", # found commented out code
  "ARG", # flake8-unused-arguments
  "PL",  # pylint
]
ignore = [
  "A003", # flake8-builtins - class attribute {name} is shadowing a python builtin
  "E501", # pycodestyle line too long, handled by black
]

[tool.ruff.per-file-ignores]
"*/migrations/*.py" = ["E501", "Q000"]
"tests/*.py" = ["S101"]

[tool.ruff.pydocstyle]
convention = "numpy"

[tool.ruff.flake8-quotes]
inline-quotes = "single"
docstring-quotes = "double"
multiline-quotes = "double"

[tool.ruff.mccabe]
max-complexity = 12

[tool.black]
line-length = 88
skip-string-normalization = true

[tool.pyright]
reportUnknownParameterType = 'warning'
reportUnknownMemberType = 'warning'
reportUnknownVariableType = 'warning'
reportMissingTypeStubs = 'warning'
