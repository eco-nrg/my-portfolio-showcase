  POSTGRES_DB_URL: postgresql://localhost:5432/econrg_store
  # econrg-db - if on server
  # 192.168.101.16 - if local
  # 10.8.0.154 - if via vpn server
  # 84.38.181.131 - if compose on prod server
  POSTGRES_DB_HOST: econrg-db
  POSTGRES_DB_NAME: econrg_store
  POSTGRES_DB_USER: econrg_admin
  POSTGRES_DB_PASSWORD: a123456b
services:
  bot:
    container_name: assistant-bot
    build:
      context: .
    volumes:
      - /orm/postgreSQL/migrations:/app/orm/postgreSQL/migrations
    environment: *bot-variables
    ports:
      - 8888:8080
    links:
      - econrg-db:econrg-db
  econrg-db:
    image: "postgres:15-alpine"
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=1GB"
      - "-c"
      - "effective_cache_size=4GB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "temp_file_limit=10GB"
      - "-c"
      - "log_min_duration_statement=200ms"
      - "-c"
      - "idle_in_transaction_session_timeout=10s"
      - "-c"
      - "lock_timeout=1s"
      - "-c"
      - "statement_timeout=60s"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
    restart: unless-stopped
    volumes:
      - ./create_database.sql:/docker-entrypoint-initdb.d/create_database.sql
      - /db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: econrg_store
      POSTGRES_USER: econrg_admin
      POSTGRES_PASSWORD: a123456b
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d econrg_store -U econrg_admin"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 4G
