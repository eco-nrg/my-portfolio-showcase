  # https://charge.eco-nrg.store - if compose on prod server
  API_SERVER_URL: http://10.8.0.154:8000
  API_BASE_PATH: /main/api
  API_VERSION: /v1
  API_SPACES_PATH: /space
  API_ALL_SPACES_PATH: /all

  BOT_TEXTS_START_MESSAGE: 'Здравствуйте! Выберите интересующую Вас зарядную станцию.'
  BOT_TEXTS_CHOOSE_CONNECTOR_MESSAGE: 'Выберите тип разъема.'
